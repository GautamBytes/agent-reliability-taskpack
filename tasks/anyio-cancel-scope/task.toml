schema_version = "1.4"
artifacts = [{ "source" = "/app/repo", "exclude" = [".git", "node_modules", "**/node_modules", "__pycache__", "**/__pycache__", ".pytest_cache", ".hypothesis", ".pnpm-store"] }, { "source" = "/logs/proxy", "service" = "model-egress", "destination" = "network-proxy" }]
source = "Personal OSS regression task based on attributed AnyIO issue 642 and merged fix 648."

[task]
name = "gautambytes/anyio-cancel-scope"
description = "Repair asyncio cancellation propagation across shielded hosts and nested cancel scopes"
authors = [{ "name" = "Gautam Manchandani" }]
keywords = ["python", "anyio", "asyncio", "cancellation", "regression"]

[metadata]
category = "software-engineering"
difficulty = "unrated"

[agent]
timeout_sec = 600.0
user = "agent"

[verifier]
timeout_sec = 300.0
environment_mode = "separate"
user = "root"

[verifier.environment]
build_timeout_sec = 1200.0
cpus = 2
memory_mb = 1024
storage_mb = 2048

[environment]
build_timeout_sec = 1200.0
cpus = 2
memory_mb = 1024
storage_mb = 2048
